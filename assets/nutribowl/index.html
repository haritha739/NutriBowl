if (typeof firebase !== "undefined") {
  if (!firebase.apps.length) {
    firebase.initializeApp(nutribowlFirebaseConfig);
  }

  const nutribowlDb = firebase.firestore();

  async function loadNutriBowlMenu() {
    try {
      console.log("Connecting to NutriBowl Firebase...");

      const snapshot = await nutribowlDb
        .collection("food_items")
        .get();

      if (snapshot.empty) {
        console.warn("Firebase food_items collection is empty.");
        return;
      }

      snapshot.forEach(doc => {
        const data = doc.data();

        // Supports documents containing food names and prices
        // as fields, such as "egg avocado bowl": 189.
        Object.entries(data).forEach(([name, value]) => {
          if (typeof value === "number") {
            updateNutriBowlFood(name, value);
          }
        });

        // Also supports documents with name and price fields.
        if (
          typeof data.name === "string" &&
          typeof data.price === "number"
        ) {
          updateNutriBowlFood(data.name, data.price);
        }
      });

      // Refresh existing cart item prices from the updated menu.
      cart = cart.map(item => {
        const food = foods.find(f => f.id === item.id);

        if (!food || item.freeReward) return item;

        return { ...item, price: food.price };
      });

      save();
      render();

      console.log("NutriBowl menu loaded from Firebase.");
      toast("Menu connected to Firebase!");
    } catch (error) {
      console.error("NutriBowl Firebase error:", error);
      toast("Could not load Firebase menu. Check connection and rules.");
    }
  }

  function updateNutriBowlFood(name, price) {
    const cleanName = name.trim();

    const existingFood = foods.find(
      food => food.name.trim().toLowerCase() ===
              cleanName.toLowerCase()
    );

    if (existingFood) {
      existingFood.price = price;
      return;
    }

    // Add Firebase menu items that are not already in the menu.
    foods.push({
      id: "firebase-" + cleanName
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-"),

      name: cleanName,
      emoji: "🥗",
      price: price,
      kcal: 300,
      protein: 15,
      carbs: 35,
      fat: 10,
      tag: "FIREBASE MENU",
      type: "Bowls",
      desc: "Menu item loaded from Firebase.",
      rating: "4.8",
      fiber: 5,
      sugar: 5,
      sodium: 180,
      calcium: 90,
      iron: 2,
      vitamin: "B vitamins"
    });
  }

  loadNutriBowlMenu();
} else {
  console.error(

let nutribowlOrdersUnsubscribe = null;
function startNutriBowlOrderSync(){
  if(typeof firebase==='undefined' || !firebase.apps.length) return;
  try {
    if(nutribowlOrdersUnsubscribe) nutribowlOrdersUnsubscribe();
    nutribowlOrdersUnsubscribe = firebase.firestore().collection('orders')
      .orderBy('createdAt','desc').limit(50)
      .onSnapshot(snapshot=>{
        const remote = snapshot.docs.map(doc=>{
          const d=doc.data()||{};
          return {...d,id:d.id||doc.id,name:d.name||d.customerName||'Customer',customerName:d.customerName||d.name||'Customer',
            date:d.date||(d.createdAt&&d.createdAt.toDate?d.createdAt.toDate().toISOString():''),
            payment:d.payment||d.paymentMethod||'Demo',paymentMethod:d.paymentMethod||d.payment||'Demo',
            subtotal:Number(d.subtotal??d.sub??d.total??0),sub:Number(d.sub??d.subtotal??d.total??0),
            delivery:Number(d.delivery??d.deliveryFee??0),deliveryFee:Number(d.deliveryFee??d.delivery??0),
            items:Array.isArray(d.items)?d.items:[],status:d.status||'Confirmed',total:Number(d.total||0)};
        });
        const remoteIds=new Set(remote.map(o=>o.id));
        const localOnly=orders.filter(o=>!remoteIds.has(o.id));
        orders=[...remote,...localOnly].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
        localStorage.setItem('nb_orders',JSON.stringify(orders));
        if(document.getElementById('main')) render();
      },error=>{console.error('Firebase order sync failed:',error);});
  } catch(error){ console.error('Could not start Firebase order sync:',error); }
}

function cartPage(){if(!cart.length)return `<div class="welcome"><div><div class="eyebrow">YOUR ORDER</div><h1>Your bag</h1><p>Good things are just a few taps away.</p></div></div><div class="panel empty"><div class="emptyicon">🛍️</div><h3>Your bag is taking a little breather</h3><p>Add something delicious and it will show up here.</p><button class="full" style="max-width:230px" onclick="navigate('discover')">Explore the menu</button></div>`;let t=cartTotals();return `<div class="welcome"><div><div class="eyebrow">ALMOST THERE</div><h1>Your bag</h1><p>Review your picks before checkout.</p></div></div><div class="builder"><section class="panel"><h3>Your items (${cart.reduce((s,i)=>s+i.qty,0)})</h3>${cart.map((it,idx)=>`<div class="cart-row"><div class="cart-emoji">${it.emoji||'🥗'}</div><div class="cart-info"><strong>${escapeHtml(it.name)}</strong><small>${it.custom?escapeHtml(it.detail):it.kcal+' kcal · '+it.protein+'g protein'}</small><div class="qty" style="justify-content:flex-start;margin-top:8px"><button onclick="changeCart(${idx},-1)">−</button><strong>${it.qty}</strong><button onclick="changeCart(${idx},1)">+</button></div></div><span class="cart-price">${money(it.price*it.qty)}</span></div>`).join('')}<button class="text-btn" onclick="navigate('discover')">＋ Add more items</button></section><aside class="summary"><h3>Bill details</h3><div class="totalrow"><span>Item total</span><strong>${money(t.sub)}</strong></div><div class="totalrow"><span>Delivery fee</span><strong>${money(t.delivery)}</strong></div><div class="totalrow"><span>Taxes</span><strong>Included in demo</strong></div><div class="totalrow grand"><span>To pay</span><span>${money(t.total)}</span></div><button class="full" onclick="navigate('checkout')">Continue to checkout ↗</button><p class="muted" style="font-size:10px">Demo checkout only. No payment will be collected.</p></aside></div>`}

async function placeOrder(e) {
  e.preventDefault();

  if (!cart.length) {
    navigate('cart');
    return;
  }

  const form = e.target;
  const submitButton = form.querySelector('button[type="submit"]');
  if (submitButton) {
    submitButton.disabled = true;
    submitButton.textContent = 'Saving order…';
  }

  try {
    if (typeof firebase === 'undefined' || !firebase.apps.length) {
      throw new Error('Firebase is not initialized. Check the Firebase SDK and configuration.');
    }

    const fd = new FormData(form);
    const totals = cartTotals();
    const orderId = 'NB-' + Date.now().toString().slice(-7);

    // Keep a plain local copy for the app's existing order history.
    const order = {
      id: orderId,
      date: new Date().toISOString(),
      name: String(fd.get('name') || '').trim(),
      customerName: String(fd.get('name') || '').trim(),
      phone: String(fd.get('phone') || '').trim(),
      address: String(fd.get('address') || '').trim(),
      instructions: String(fd.get('instructions') || '').trim(),
      payment: String(fd.get('payment') || ''),
      paymentMethod: String(fd.get('payment') || ''),
      items: cart.map(item => ({
        id: String(item.id || ''),
        name: String(item.name || ''),
        emoji: String(item.emoji || '🥗'),
        qty: Number(item.qty) || 1,
        price: Number(item.price) || 0,
        custom: Boolean(item.custom),
        detail: String(item.detail || '')
      })),
      subtotal: totals.sub,
      sub: totals.sub,
      delivery: totals.delivery,
      deliveryFee: totals.delivery,
      total: totals.total,
      status: 'Confirmed'
    };

    // Save order details to Cloud Firestore before clearing the cart.
    await firebase.firestore()
      .collection('orders')
      .doc(orderId)
      .set({
        ...order,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

    profile.name = order.customerName;
    profile.address = order.address;
    orders.unshift(order);
    cart = [];
    save();
    page = 'orders';
    render();
    toast('Order saved to Firebase successfully!');
  } catch (error) {
    console.error('Firebase order save failed:', error);
    alert('Order was not saved to Firebase. Check your internet connection and Firestore Rules, then try again. Details: ' + (error && error.message ? error.message : error));
  } finally {
    if (submitButton) {
      submitButton.disabled = false;
      submitButton.textContent = 'Place demo order';
    }
  }
}

function completeWorkout(id,name){let n=Number(localStorage.getItem('nb_fitness_sessions')||0)+1;localStorage.setItem('nb_fitness_sessions',String(n));localStorage.setItem('nb_last_workout',new Date().toISOString());toast(name+' completed · '+n+' session'+(n===1?'':'s')+' logged');render()}
function rewards(){let points=250+orders.length*25+Number(localStorage.getItem('nb_fitness_sessions')||0)*10,sessions=Number(localStorage.getItem('nb_fitness_sessions')||0),active=orders.length>=1||sessions>=2,week=new Date().getFullYear()+'-W'+Math.ceil((((new Date()-new Date(new Date().getFullYear(),0,1))/86400000)+new Date(new Date().getFullYear(),0,1).getDay()+1)/7),used=localStorage.getItem('nb_dessert_week')===week,cheatUsed=localStorage.getItem('nb_cheat_week')===week;return `<div class="welcome"><div><div class="eyebrow">LITTLE TREATS, EARNED</div><h1>Your rewards</h1><p>Celebrate your healthy habits — balance includes treats, too.</p></div><span class="active-stamp">${active?'✦ Active member':'🌱 Start your journey'}</span></div><div class="hero" style="min-height:200px;grid-template-columns:1fr .4fr;background:linear-gradient(110deg,#28533d,#427a4e)"><div class="hero-copy"><span class="tag">✧ NUTRIBOWL CLUB</span><h2>You have<br><span style="color:var(--lime)">${points} points.</span></h2><p>Earn points from orders and completed movement sessions.</p></div><div class="hero-art"><div class="bowl-art">🎁</div></div></div><div class="reward-banner" style="margin:18px 0"><h3>🍰 Your Cheat Meal Day + Free Dessert</h3><p class="muted">Active members can enjoy one flexible cheat-meal day and one free dessert each week. It is about balance, not restriction.</p><p style="font-size:12px;margin:8px 0"><strong>Eligibility:</strong> Place at least one order or complete two fitness sessions in this demo.</p>${active?`<span class="active-stamp">✓ You qualify this week</span>`:`<span class="chip">Place an order or complete 2 workouts to activate</span>`}<div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap"><button class="full" style="max-width:280px;width:auto" ${(!active||used)?'disabled':''} onclick="claimDessert('${week}')">${used?'Free dessert claimed ✓':active?'Claim free dessert':'Unlock free dessert'}</button><button class="secondary" ${(!active||cheatUsed)?'disabled':''} onclick="claimCheatMeal('${week}')">${cheatUsed?'Flexible meal day claimed ✓':active?'Activate cheat-meal day':'Unlock cheat-meal day'}</button><button class="secondary" onclick="navigate('discover')">Explore treats</button></div><p class="muted" style="font-size:10px;margin-top:10px">Weekly eligibility and claim are saved locally in this demo. Production rewards should be verified by the backend.</p></div>${head('Rewards to unlock','Demo rewards — no real redemption or payment.') }<div class="food-grid"><div class="panel"><div style="font-size:35px">🥤</div><h3>Free healthy drink</h3><p class="muted">A refreshing pick on us.</p><span class="chip">300 points</span><button class="full" style="margin-top:14px" ${points<300?'disabled':''} onclick="redeem(300,'Free healthy drink')">${points>=300?'Redeem reward':'More points needed'}</button></div><div class="panel"><div style="font-size:35px">🥗</div><h3>₹100 off a bowl</h3><p class="muted">Make your next bowl extra special.</p><span class="chip">500 points</span><button class="full" style="margin-top:14px" ${points<500?'disabled':''} onclick="redeem(500,'₹100 off a bowl')">${points>=500?'Redeem reward':'More points needed'}</button></div><div class="panel"><div style="font-size:35px">🍨</div><h3>Free dessert</h3><p class="muted">Dark Cocoa Yogurt Dessert — available to active members once a week.</p><span class="chip">${used?'Claimed this week':active?'Ready to claim':'Locked'}</span><button class="secondary" style="margin-top:14px" onclick="navigate('discover');searchTerm='dessert';render()">View dessert</button></div></div>`}
function claimDessert(week){let sessions=Number(localStorage.getItem('nb_fitness_sessions')||0),active=orders.length>=1||sessions>=2;if(!active){toast('Place an order or complete 2 workouts first');return}if(localStorage.getItem('nb_dessert_week')===week){toast('You already claimed this week’s dessert');return}localStorage.setItem('nb_dessert_week',week);let d=foods.find(f=>f.id==='dark-choco-yogurt');if(d){cart.push({...d,id:'free-dessert-'+Date.now(),name:'Free dessert — '+d.name,qty:1,price:0,freeReward:true});save()}toast('Free dessert added to your bag!');render()}
function claimCheatMeal(week){let sessions=Number(localStorage.getItem('nb_fitness_sessions')||0),active=orders.length>=1||sessions>=2;if(!active){toast('Place an order or complete 2 workouts first');return}if(localStorage.getItem('nb_cheat_week')===week){toast('Your flexible meal day is already activated this week');return}localStorage.setItem('nb_cheat_week',week);toast('Flexible cheat-meal day activated! Enjoy your favourites in balance.');render()}
function redeem(p,n){toast(n+' redemption is a demo only.');}
function profilePage(){return `<div class="welcome"><div><div class="eyebrow">YOUR SPACE</div><h1>My profile</h1><p>Your details, goals and progress in one place.</p></div></div><div class="builder"><section class="panel"><h3>Personal details</h3><p class="muted">Changes are saved in this browser for this demo.</p><form onsubmit="saveProfile(event)"><div class="formgrid"><div class="field wide"><label>Your name</label><input name="name" required value="${escapeAttr(profile.name)}"></div><div class="field wide"><label>Delivery address</label><input name="address" required value="${escapeAttr(profile.address)}"></div><div class="field wide"><label>Your wellness goal</label><select name="goal">${['Eat healthier','Build strength','More everyday energy','Balanced routine','Explore nutrition'].map(g=>`<option ${profile.goal===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Weight (optional, kg)</label><input name="weight" type="number" min="1" max="400" value="${escapeAttr(profile.weight||'')}" placeholder="e.g. 62"></div><div class="field"><label>Daily water goal</label><select name="water"><option>6 glasses</option><option>8 glasses</option><option>10 glasses</option></select></div><div class="field wide"><button class="full" type="submit">Save my details</button></div></div></form></section><aside><div class="panel"><div class="avatar" style="width:60px;height:60px;font-size:28px;margin-bottom:14px">😊</div><h3>${escapeHtml(profile.name||'NutriBowl member')}</h3><p class="muted">${escapeHtml(profile.goal||'Eat healthier')}</p><div class="totalrow"><span>Orders placed</span><strong>${orders.length}</strong></div><div class="totalrow"><span>Reward points</span><strong>${250+orders.length*25}</strong></div><div class="totalrow"><span>Saved address</span><strong style="max-width:150px;text-align:right">${escapeHtml(profile.address)}</strong></div></div><div class="panel"><h3>Your progress</h3><p class="muted">A simple demo snapshot, not a medical assessment.</p><div style="display:flex;justify-content:space-between;font-size:12px"><span>Meals ordered</span><strong>${Math.min(orders.length,7)}/7</strong></div><div class="progress"><span style="width:${Math.min(orders.length/7*100,100)}%"></span></div><button class="secondary" onclick="navigate('orders')">View order history</button></div></aside></div>`}
function saveProfile(e){e.preventDefault();let d=new FormData(e.target);profile.name=d.get('name');profile.address=d.get('address');profile.goal=d.get('goal');profile.weight=d.get('weight');save();render();toast('Profile saved on this device')}
function admin(){let total=orders.reduce((s,o)=>s+o.total,0),count=orders.reduce((s,o)=>s+o.items.reduce((n,i)=>n+i.qty,0),0);return `<div class="welcome"><div><div class="eyebrow">DEMO WORKSPACE</div><h1>Restaurant dashboard</h1><p>Orders are synced from Firebase for this demo workspace.</p></div><span class="chip">Demo data</span></div><div class="stats"><div class="stat"><div class="stat-icon">▤</div><div><strong>${orders.length}</strong><small>Orders received</small></div></div><div class="stat"><div class="stat-icon">₹</div><div><strong>${money(total)}</strong><small>Demo order value</small></div></div><div class="stat"><div class="stat-icon">🥗</div><div><strong>${count}</strong><small>Items ordered</small></div></div></div>${head('Order queue','Advance a sample order to simulate kitchen operations.')}${orders.length?orders.map(o=>`<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px"><div><span class="chip">${o.status}</span><h3 style="margin-top:10px">${o.id}</h3><p class="muted">${escapeHtml(o.name)} · ${o.items.length} line items</p></div><strong>${money(o.total)}</strong></div><p class="muted">${o.items.map(i=>i.qty+' × '+escapeHtml(i.name)).join(' · ')}</p><button class="secondary" onclick="adminAdvance('${o.id}')">Update order status ↗</button></div>`).join(''):`<div class="panel empty"><div class="emptyicon">📋</div><h3>Your queue is clear</h3><p>Demo orders placed by the customer appear here.</p><button class="full" style="max-width:200px" onclick="navigate('discover')">Create a sample order</button></div>`}<p class="muted" style="font-size:10px">Production admin requires authenticated staff roles, server-side authorization and a shared backend.</p>`}
async function adminAdvance(id){let o=orders.find(x=>x.id===id);if(!o)return;let steps=['Confirmed','Preparing','Ready for pickup','On the way','Delivered'];o.status=steps[Math.min(Math.max(steps.indexOf(o.status),0)+1,steps.length-1)];save();try{if(typeof firebase!=='undefined'&&firebase.apps.length)await firebase.firestore().collection('orders').doc(o.id).update({status:o.status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){console.error('Could not sync kitchen status:',e);toast('Status changed locally; Firebase update failed.')}render();toast('Kitchen updated: '+o.status)}
function partner(){let o=orders.find(x=>!['Delivered'].includes(x.status));return `<div class="welcome"><div><div class="eyebrow">DEMO WORKSPACE</div><h1>Delivery partner</h1><p>A sample delivery-partner view for accepting and updating a delivery.</p></div><div class="avatar">🛵</div></div>${o?`<div class="panel"><span class="chip active">Available demo delivery</span><h2 style="margin-top:14px">${o.id}</h2><p class="muted">Pickup: NutriBowl Kitchen</p><p class="muted">Drop-off: ${escapeHtml(o.address)}</p><div class="totalrow"><span>Order status</span><strong>${o.status}</strong></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px"><button class="full" style="width:auto" onclick="partnerAdvance('${o.id}')">Accept / update delivery ↗</button><button class="secondary" onclick="navigate('tracking')">Customer tracking view</button></div></div>`:`<div class="panel empty"><div class="emptyicon">🛵</div><h3>No delivery assigned</h3><p>Place an order to see a sample delivery task.</p><button class="full" style="max-width:210px" onclick="navigate('discover')">Explore menu</button></div>`}<div class="panel"><h3>Delivery checklist</h3>${['Confirm order ID and items','Collect the sealed order','Verify delivery address','Mark delivery complete'].map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line);font-size:13px">☐ &nbsp;${x}</div>`).join('')}<p class="muted" style="font-size:10px;margin-top:15px">Live partner assignment and GPS tracking need a mobile partner app, location permissions and backend coordination.</p></div>`}
async function partnerAdvance(id){let o=orders.find(x=>x.id===id);if(!o)return;let steps=['Confirmed','Preparing','Ready for pickup','On the way','Delivered'];o.status=steps[Math.min(Math.max(steps.indexOf(o.status),0)+1,steps.length-1)];save();try{if(typeof firebase!=='undefined'&&firebase.apps.length)await firebase.firestore().collection('orders').doc(o.id).update({status:o.status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){console.error('Could not sync delivery status:',e);toast('Status changed locally; Firebase update failed.')}render();toast('Delivery status: '+o.status)}
function renderContentOnly(){let main=document.getElementById('main');if(page==='discover')main.innerHTML=discover()}
function clearFilters(){filter='All';selectedNutrient='';searchTerm='';render()}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function render(){save();navActive();let main=document.getElementById('main');let pages={home,discover,builder,breakfast,cart:cartPage,checkout,orders:ordersPage,tracking,fitness,rewards,profile:profilePage,admin,partner};main.innerHTML=(pages[page]||home)()}
render();
startNutriBowlOrderSync();
</script></body></html>
